# Render blueprint: one free web service running scripts/serve_web.py (Python, no build step beyond jsonschema).
services:
  - type: web
    name: root-room
    runtime: python
    plan: free
    buildCommand: pip install jsonschema
    startCommand: python3 scripts/serve_web.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: ROOT_ROOM_JSON_CACHE_MB
        value: "64"
      - key: PYTHON_VERSION
        value: "3.12.6"
